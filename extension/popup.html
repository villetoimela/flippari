<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; width: 280px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#111214; color:#f4f4f5; }
  .wrap { padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 4px; display:flex; align-items:center; gap:8px; }
  .logo { width:22px; height:22px; border-radius:6px; background:#16a34a; display:grid; place-items:center; font-weight:800; }
  p { color:#a1a1aa; margin: 6px 0 12px; }
  label { display:block; color:#a1a1aa; margin-bottom: 4px; }
  input { width:100%; box-sizing:border-box; background:#1f1f23; color:#fff; border:1px solid #3f3f46; border-radius:8px; padding:8px; }
  button { margin-top: 10px; width:100%; background:#16a34a; color:#fff; border:0; border-radius:8px; padding:9px; font-weight:700; cursor:pointer; }
  .muted { color:#71717a; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="logo">F</span> Flippari</h1>
  <p>Julkaise tuotteet dashboardista – laajennus täyttää Torin ja Vintedin lomakkeet.</p>
  <label for="url">Dashboardin osoite</label>
  <input id="url" placeholder="https://flippari.vercel.app" />
  <button id="open">Avaa dashboard</button>
  <div class="muted" id="ver"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
